kind: Dashboard
metadata:
  name: pod-resources
  createdAt: "0001-01-01T00:00:00Z"
  project: perses
  updatedAt: "0001-01-01T00:00:00Z"
  version: 0
spec:
  display:
    name: Pod Resources
    description: 'Pod/container resource overview: memory decomposition, CPU utilization, network throughput, and I/O pressure.'
  variables:
    - kind: ListVariable
      spec:
        display:
          name: Namespace
          hidden: false
        name: namespace
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
            labelName: namespace
            matchers:
              - container_memory_working_set_bytes{}
    - kind: ListVariable
      spec:
        display:
          name: Pod
          hidden: false
        name: pod
        allowAllValue: true
        allowMultiple: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
            labelName: pod
            matchers:
              - container_memory_working_set_bytes{namespace=~"^$namespace$",container!="",container!="POD"}
    - kind: ListVariable
      spec:
        display:
          name: Container
          hidden: false
        name: container
        allowAllValue: true
        allowMultiple: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
            labelName: container
            matchers:
              - container_memory_working_set_bytes{namespace=~"^$namespace$",pod=~"^$pod$",container!="",container!="POD"}
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Working Set
          description: Memory that cannot be freely reclaimed (usage minus inactive file cache). This is what the kubelet uses for eviction and OOM decisions.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: bytes
              decimalPlaces: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(container_memory_working_set_bytes{namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$", container!="POD", container!=""})
    "0_1":
      kind: Panel
      spec:
        display:
          name: Memory Limit
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: bytes
              decimalPlaces: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(kube_pod_container_resource_limits{resource="memory", namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$"})
    "0_2":
      kind: Panel
      spec:
        display:
          name: Utilization
          description: working_set / limit — how close to OOM
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: percent
              decimalPlaces: 1
            thresholds:
              steps:
                - value: 0
                  color: '#32ac2d'
                - value: 0.80
                  color: '#ed8128'
                - value: 0.95
                  color: '#f53636'
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(
                      container_memory_working_set_bytes{namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$", container!="POD", container!=""}
                      * on (namespace, pod, container) group_left()
                      (kube_pod_container_resource_limits{resource="memory", namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$"} * 0 + 1)
                    )
                    /
                    sum(kube_pod_container_resource_limits{resource="memory", namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$"})
    "0_3":
      kind: Panel
      spec:
        display:
          name: RSS
          description: Anonymous memory (heap, stack). Cannot be reclaimed without swap — primary driver of OOM kills.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: bytes
              decimalPlaces: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(container_memory_rss{namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$", container!="POD", container!=""})
    "1_0":
      kind: Panel
      spec:
        display:
          name: Memory Breakdown
          description: Stacked memory usage with limit threshold. Total height = container_memory_usage_bytes.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0.7
              lineWidth: 2
              stack: all
            querySettings:
              - queryIndex: 4
                colorMode: fixed-single
                colorValue: '#FFFFFF'
                lineStyle: dotted
                stack: false
                areaOpacity: 0
            yAxis:
              format:
                unit: bytes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(container_memory_rss{namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$", container!="POD", container!=""})
                  seriesNameFormat: Non-reclaimable (anon/RSS)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(container_memory_usage_bytes{namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$", container!="POD", container!=""})
                    - sum(container_memory_rss{namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$", container!="POD", container!=""})
                    - sum(container_memory_cache{namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$", container!="POD", container!=""})
                  seriesNameFormat: Kernel overhead
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(container_memory_cache{namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$", container!="POD", container!=""})
                    - (
                      sum(container_memory_usage_bytes{namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$", container!="POD", container!=""})
                      - sum(container_memory_working_set_bytes{namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$", container!="POD", container!=""})
                    )
                  seriesNameFormat: Reclaimable hot (active file)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(container_memory_usage_bytes{namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$", container!="POD", container!=""})
                    - sum(container_memory_working_set_bytes{namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$", container!="POD", container!=""})
                  seriesNameFormat: Reclaimable cold (inactive file)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(kube_pod_container_resource_limits{resource="memory", namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$"})
                  seriesNameFormat: ── Memory Limit
    "2_0":
      kind: Panel
      spec:
        display:
          name: CPU Usage
          description: Actual CPU consumption (cores).
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 2
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(container_cpu_usage_seconds_total{namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$", container!="POD", container!="", cpu="total"}[5m]))
    "2_1":
      kind: Panel
      spec:
        display:
          name: CPU Limit
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(kube_pod_container_resource_limits{resource="cpu", namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$"})
    "2_2":
      kind: Panel
      spec:
        display:
          name: CPU Utilization
          description: CPU usage / limit
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: percent
              decimalPlaces: 1
            thresholds:
              steps:
                - value: 0
                  color: '#32ac2d'
                - value: 0.80
                  color: '#ed8128'
                - value: 0.95
                  color: '#f53636'
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(
                      rate(container_cpu_usage_seconds_total{namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$", container!="POD", container!="", cpu="total"}[5m])
                      * on (namespace, pod, container) group_left()
                      (kube_pod_container_resource_limits{resource="cpu", namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$"} * 0 + 1)
                    )
                    /
                    sum(kube_pod_container_resource_limits{resource="cpu", namespace=~"^$namespace$", pod=~"^$pod$", container=~"^$container$"})
    "3_0":
      kind: Panel
      spec:
        display:
          name: Throughput
          description: Network receive and transmit rate (excluding loopback).
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0.3
              lineWidth: 1.5
            yAxis:
              format:
                unit: bytes/sec
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(container_network_receive_bytes_total{namespace=~"^$namespace$", pod=~"^$pod$", container="POD", interface!="lo"}[5m]))
                  seriesNameFormat: RX
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(container_network_transmit_bytes_total{namespace=~"^$namespace$", pod=~"^$pod$", container="POD", interface!="lo"}[5m]))
                  seriesNameFormat: TX
    "3_1":
      kind: Panel
      spec:
        display:
          name: Drops & Errors
          description: Network packet drops and errors. Normal value is 0.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0
              lineWidth: 2
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(container_network_receive_packets_dropped_total{namespace=~"^$namespace$", pod=~"^$pod$", container="POD"}[5m])) + sum(rate(container_network_transmit_packets_dropped_total{namespace=~"^$namespace$", pod=~"^$pod$", container="POD"}[5m]))
                  seriesNameFormat: Drops
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(container_network_receive_errors_total{namespace=~"^$namespace$", pod=~"^$pod$", container="POD"}[5m])) + sum(rate(container_network_transmit_errors_total{namespace=~"^$namespace$", pod=~"^$pod$", container="POD"}[5m]))
                  seriesNameFormat: Errors
    "4_0":
      kind: Panel
      spec:
        display:
          name: I/O Pressure — Waiting (some)
          description: Fraction of wall-clock time at least one task in this pod was stalled on block I/O. Requires cgroupv2.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0
              lineWidth: 2
            yAxis:
              format:
                unit: percent
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: pod:io:pressure_waiting:ratio{namespace=~"^$namespace$", pod=~"^$pod$"}
                  seriesNameFormat: '{{pod}}'
    "4_1":
      kind: Panel
      spec:
        display:
          name: I/O Pressure — Stalled (full)
          description: Fraction of wall-clock time ALL tasks in this pod were stalled on I/O (zero progress).
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0
              lineWidth: 2
            yAxis:
              format:
                unit: percent
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: pod:io:pressure_stalled:ratio{namespace=~"^$namespace$", pod=~"^$pod$"}
                  seriesNameFormat: '{{pod}}'
  layouts:
    - kind: Grid
      spec:
        display:
          title: Memory
        items:
          - x: 0
            "y": 0
            width: 6
            height: 8
            content:
              $ref: '#/spec/panels/0_0'
          - x: 6
            "y": 0
            width: 6
            height: 8
            content:
              $ref: '#/spec/panels/0_1'
          - x: 12
            "y": 0
            width: 6
            height: 8
            content:
              $ref: '#/spec/panels/0_2'
          - x: 18
            "y": 0
            width: 6
            height: 8
            content:
              $ref: '#/spec/panels/0_3'
    - kind: Grid
      spec:
        display:
          title: Memory Decomposition
        items:
          - x: 0
            "y": 0
            width: 24
            height: 12
            content:
              $ref: '#/spec/panels/1_0'
    - kind: Grid
      spec:
        display:
          title: CPU
        items:
          - x: 0
            "y": 0
            width: 8
            height: 8
            content:
              $ref: '#/spec/panels/2_0'
          - x: 8
            "y": 0
            width: 8
            height: 8
            content:
              $ref: '#/spec/panels/2_1'
          - x: 16
            "y": 0
            width: 8
            height: 8
            content:
              $ref: '#/spec/panels/2_2'
    - kind: Grid
      spec:
        display:
          title: Network
        items:
          - x: 0
            "y": 0
            width: 12
            height: 10
            content:
              $ref: '#/spec/panels/3_0'
          - x: 12
            "y": 0
            width: 12
            height: 10
            content:
              $ref: '#/spec/panels/3_1'
    - kind: Grid
      spec:
        display:
          title: Storage
        items:
          - x: 0
            "y": 0
            width: 12
            height: 10
            content:
              $ref: '#/spec/panels/4_0'
          - x: 12
            "y": 0
            width: 12
            height: 10
            content:
              $ref: '#/spec/panels/4_1'
  duration: 6h
