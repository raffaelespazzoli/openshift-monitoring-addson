kind: Dashboard
metadata:
  name: node-resources
  createdAt: "0001-01-01T00:00:00Z"
  project: perses
  updatedAt: "0001-01-01T00:00:00Z"
  version: 0
spec:
  display:
    name: Node Resources
    description: 'Per-node resource overview: memory utilization & PSI, CPU utilization & PSI, NIC saturation, I/O pressure, Fibre Channel, and multipath health.'
  variables:
    - kind: ListVariable
      spec:
        display:
          name: Node
          hidden: false
        name: node
        allowAllValue: true
        allowMultiple: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
            labelName: node
            matchers:
              - kube_node_status_capacity{}
    - kind: ListVariable
      spec:
        display:
          name: NIC
          hidden: false
        name: nic
        allowAllValue: true
        allowMultiple: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
            labelName: device
            matchers:
              - node_nic:network:transmit_utilization:ratio{instance=~"$node"}
    - kind: ListVariable
      spec:
        display:
          name: HBA
          hidden: false
        name: hba
        allowAllValue: true
        allowMultiple: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
            labelName: fc_host
            matchers:
              - node_hba:fc:transmit_utilization:ratio{instance=~"$node"}
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Capacity
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: bytes
              decimalPlaces: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(kube_node_status_capacity{resource="memory", node=~"$node"})
    "0_1":
      kind: Panel
      spec:
        display:
          name: Allocatable
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: bytes
              decimalPlaces: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(kube_node_status_allocatable{resource="memory", node=~"$node"})
    "0_2":
      kind: Panel
      spec:
        display:
          name: Workload Utilization
          description: kubepods.slice working_set / allocatable — the kubelet eviction metric
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: percent
              decimalPlaces: 1
            thresholds:
              steps:
                - value: 0
                  color: '#32ac2d'
                - value: 0.80
                  color: '#ed8128'
                - value: 0.95
                  color: '#f53636'
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(node:memory:workloads_utilization:ratio{node=~"$node"})
    "0_3":
      kind: Panel
      spec:
        display:
          name: Reserved
          description: system-reserved + kube-reserved + eviction-threshold
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: bytes
              decimalPlaces: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(kube_node_status_capacity{resource="memory", node=~"$node"})
                    - sum(kube_node_status_allocatable{resource="memory", node=~"$node"})
    "0_4":
      kind: Panel
      spec:
        display:
          name: System Used
          description: system.slice total memory (can exceed reserved via file cache)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0.3
              lineWidth: 1.5
            yAxis:
              format:
                unit: bytes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(node:memory:system_used:bytes{node=~"$node"})
                  seriesNameFormat: '{{node}}'
    "0_5":
      kind: Panel
      spec:
        display:
          name: Memory Pressure
          description: PSI — fraction of time processes stalled waiting for memory reclaim
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0.3
              lineWidth: 1.5
            yAxis:
              format:
                unit: percent
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: node:memory:pressure:ratio{node=~"$node"}
                  seriesNameFormat: '{{node}}'
    "1_0":
      kind: Panel
      spec:
        display:
          name: Capacity
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(kube_node_status_capacity{resource="cpu", node=~"$node"})
    "1_1":
      kind: Panel
      spec:
        display:
          name: Allocatable
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(kube_node_status_allocatable{resource="cpu", node=~"$node"})
    "1_2":
      kind: Panel
      spec:
        display:
          name: Workload Utilization
          description: kubepods.slice CPU usage / allocatable
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: percent
              decimalPlaces: 1
            thresholds:
              steps:
                - value: 0
                  color: '#32ac2d'
                - value: 0.80
                  color: '#ed8128'
                - value: 0.95
                  color: '#f53636'
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(rate(container_cpu_usage_seconds_total{id="/kubepods.slice", node=~"$node"}[5m]))
                    / sum(kube_node_status_allocatable{resource="cpu", node=~"$node"})
    "1_3":
      kind: Panel
      spec:
        display:
          name: System Used
          description: system.slice CPU usage (cores)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0.3
              lineWidth: 1.5
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(container_cpu_usage_seconds_total{id="/system.slice", node=~"$node"}[5m]))
                  seriesNameFormat: '{{node}}'
    "1_4":
      kind: Panel
      spec:
        display:
          name: CPU Pressure
          description: PSI — fraction of time runnable tasks waited for a CPU
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0.3
              lineWidth: 1.5
            yAxis:
              format:
                unit: percent
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: node:cpu:pressure:ratio{node=~"$node"}
                  seriesNameFormat: '{{node}}'
    "2_0":
      kind: Panel
      spec:
        display:
          name: NIC Utilization
          description: Transmit and receive utilization vs link speed for physical NICs.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0
              lineWidth: 2
            yAxis:
              format:
                unit: percent
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: node_nic:network:transmit_utilization:ratio{instance=~"$node", device=~"$nic"}
                  seriesNameFormat: TX {{device}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: node_nic:network:receive_utilization:ratio{instance=~"$node", device=~"$nic"}
                  seriesNameFormat: RX {{device}}
    "2_1":
      kind: Panel
      spec:
        display:
          name: NIC Drops & Errors
          description: Packet drops (ring buffer overflow) and errors (CRC failures). Normal rate is 0.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0
              lineWidth: 2
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: node_nic:network:drop_rate:packets_per_second{instance=~"$node", device=~"$nic"}
                  seriesNameFormat: Drops {{device}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: node_nic:network:error_rate:packets_per_second{instance=~"$node", device=~"$nic"}
                  seriesNameFormat: Errors {{device}}
    "3_0":
      kind: Panel
      spec:
        display:
          name: I/O Pressure — Waiting (some)
          description: Fraction of wall-clock time at least one task was stalled waiting for block I/O.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0
              lineWidth: 2
            yAxis:
              format:
                unit: percent
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: node:io:pressure_waiting:ratio{node=~"$node"}
                  seriesNameFormat: '{{node}}'
    "3_1":
      kind: Panel
      spec:
        display:
          name: I/O Pressure — Stalled (full)
          description: Fraction of wall-clock time ALL tasks were stalled on I/O (zero CPU progress).
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0
              lineWidth: 2
            yAxis:
              format:
                unit: percent
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: node:io:pressure_stalled:ratio{node=~"$node"}
                  seriesNameFormat: '{{node}}'
    "4_0":
      kind: Panel
      spec:
        display:
          name: FC HBA Utilization
          description: Transmit and receive utilization vs port link speed.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0
              lineWidth: 2
            yAxis:
              format:
                unit: percent
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: node_hba:fc:transmit_utilization:ratio{instance=~"$node", fc_host=~"$hba"}
                  seriesNameFormat: TX {{fc_host}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: node_hba:fc:receive_utilization:ratio{instance=~"$node", fc_host=~"$hba"}
                  seriesNameFormat: RX {{fc_host}}
    "4_1":
      kind: Panel
      spec:
        display:
          name: FC Errors & Link Loss
          description: CRC/frame errors and loss-of-signal/sync events. Normal value is 0.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0
              lineWidth: 2
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: node_hba:fc:error_rate:frames_per_second{instance=~"$node", fc_host=~"$hba"}
                  seriesNameFormat: Errors {{fc_host}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: node_hba:fc:link_loss_rate:per_second{instance=~"$node", fc_host=~"$hba"}
                  seriesNameFormat: Link loss {{fc_host}}
    "5_0":
      kind: Panel
      spec:
        display:
          name: Devices
          description: Number of DM-multipath devices on the node.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: count(node_dmmultipath_device_active{instance=~"$node"})
    "5_1":
      kind: Panel
      spec:
        display:
          name: Total Paths
          description: Sum of all I/O paths across all multipath devices.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(node_dmmultipath_device_paths{instance=~"$node"})
    "5_2":
      kind: Panel
      spec:
        display:
          name: Failed Paths
          description: Paths in a non-active state. Any value > 0 means degraded redundancy.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
            thresholds:
              steps:
                - value: 0
                  color: '#32ac2d'
                - value: 1
                  color: '#f53636'
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(node_dmmultipath_device_paths_failed{instance=~"$node"})
  layouts:
    - kind: Grid
      spec:
        display:
          title: Memory
        items:
          - x: 0
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/0_0'
          - x: 4
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/0_1'
          - x: 8
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/0_2'
          - x: 12
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/0_3'
          - x: 16
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/0_4'
          - x: 20
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/0_5'
    - kind: Grid
      spec:
        display:
          title: CPU
        items:
          - x: 0
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/1_0'
          - x: 4
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/1_1'
          - x: 8
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/1_2'
          - x: 12
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/1_3'
          - x: 16
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/1_4'
    - kind: Grid
      spec:
        display:
          title: Networking
        items:
          - x: 0
            "y": 0
            width: 12
            height: 10
            content:
              $ref: '#/spec/panels/2_0'
          - x: 12
            "y": 0
            width: 12
            height: 10
            content:
              $ref: '#/spec/panels/2_1'
    - kind: Grid
      spec:
        display:
          title: Storage — I/O Pressure
        items:
          - x: 0
            "y": 0
            width: 12
            height: 10
            content:
              $ref: '#/spec/panels/3_0'
          - x: 12
            "y": 0
            width: 12
            height: 10
            content:
              $ref: '#/spec/panels/3_1'
    - kind: Grid
      spec:
        display:
          title: Storage — Fibre Channel
        items:
          - x: 0
            "y": 0
            width: 12
            height: 10
            content:
              $ref: '#/spec/panels/4_0'
          - x: 12
            "y": 0
            width: 12
            height: 10
            content:
              $ref: '#/spec/panels/4_1'
    - kind: Grid
      spec:
        display:
          title: Storage — Multipath Health
        items:
          - x: 0
            "y": 0
            width: 8
            height: 8
            content:
              $ref: '#/spec/panels/5_0'
          - x: 8
            "y": 0
            width: 8
            height: 8
            content:
              $ref: '#/spec/panels/5_1'
          - x: 16
            "y": 0
            width: 8
            height: 8
            content:
              $ref: '#/spec/panels/5_2'
  duration: 6h
